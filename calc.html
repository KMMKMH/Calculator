<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="calc.js" defer></script>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div id="container">
        <div id="display">0</div>
        <div class="keys">
            <button id="button7" class="button">7</button>
            <button id="button8" class="button">8</button>
            <button id="button9" class="button">9</button>
            <button id="buttonDiv" class="button symbol">÷</button>
        </div>
        <div class="keys">
            <button id="button7" class="button">4</button>
            <button id="button8" class="button">5</button>
            <button id="button9" class="button">6</button>
            <button id="buttonMult" class="button symbol">×</button>
        </div>
        <div class="keys">
            <button id="button7" class="button">1</button>
            <button id="button8" class="button">2</button>
            <button id="button9" class="button">3</button>
            <button id="buttonMins" class="button symbol">-</button>
        </div>
        <div class="keys">
            <button id="buttonC" class="button">C</button>
            <button id="button0" class="button">0</button>
            <button id="buttonEql" class="button symbol">=</button>
            <button id="buttonPls" class="button symbol">+</button>
        </div>
    </div>
</body>
</html>
